name: CI & Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate Shell Script Syntax (bash -n)
        run: |
          bash -n cluster-ctl.sh
          bash -n setup-phone.sh

      - name: Run ShellCheck
        run: |
          shellcheck -e SC1090,SC1091,SC2087 cluster-ctl.sh
          shellcheck -e SC1090,SC1091,SC2087 setup-phone.sh

      - name: Verify Environment Parity
        run: |
          python3 -c '
          import os

          def get_keys(filename):
              keys = set()
              with open(filename) as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#") and "=" in line:
                          keys.add(line.split("=")[0].strip())
              return keys

          example_keys = get_keys(".env.example")
          if os.path.exists(".env"):
              active_keys = get_keys(".env")
              diff = example_keys - active_keys
              if diff:
                  print("Warning: Missing keys in .env:", diff)
          print("Validated environment template with keys:", sorted(list(example_keys)))
          '

      - name: Setup Node.js for Prettier
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Check Formatting with Prettier
        run: npx prettier --check README.md docs/*.html docs/*.css docs/*.js

  deploy-docs:
    name: Deploy GitHub Pages Site
    needs: lint-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
